apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: WaterMonitoring
      defaultBucket: water_quality
    secureJsonData:
      token: my-super-secret-token-12345
    isDefault: true
    editable: true
