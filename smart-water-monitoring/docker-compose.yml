# ===========================================================
# Smart Water Quality Monitoring - Docker Compose
# ===========================================================
# Architecture:
#   Sensor Simulator → Mosquitto → Node-RED → InfluxDB → Grafana
#                                     ↓
#                               Eclipse Ditto (Digital Twin)
# ===========================================================

services:

  # ---- MQTT Broker ----
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - water-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Node-RED Edge Processing Layer ----
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/data:/data
    environment:
      - TZ=UTC
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - DITTO_URL=http://nginx/api/2
    networks:
      - water-network
    depends_on:
      - mosquitto
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1880/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- InfluxDB Time-Series Database ----
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - water-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Grafana Dashboard ----
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - water-network
    depends_on:
      - influxdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Python Sensor Simulator ----
  simulator:
    build: ./simulator
    container_name: sensor-simulator
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - SIMULATION_INTERVAL=5
    networks:
      - water-network
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # ===============================
  # Eclipse Ditto - Digital Twin
  # ===============================

  # ---- MongoDB (required by Ditto) ----
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    volumes:
      - mongodb-data:/data/db
    networks:
      - water-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Ditto Policies Service ----
  ditto-policies:
    image: eclipse/ditto-policies:3.4.3
    container_name: ditto-policies
    environment:
      - TZ=UTC
      - INSTANCE_INDEX=1
      - BIND_HOSTNAME=0.0.0.0
      - MONGO_DB_URI=mongodb://mongodb:27017/policies
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=80 -XX:InitialRAMPercentage=40
      - CLUSTER_BS_REQUIRED_CONTACTS=1
    networks:
      water-network:
        aliases:
          - ditto-cluster
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # ---- Ditto Things Service ----
  ditto-things:
    image: eclipse/ditto-things:3.4.3
    container_name: ditto-things
    environment:
      - TZ=UTC
      - INSTANCE_INDEX=1
      - BIND_HOSTNAME=0.0.0.0
      - MONGO_DB_URI=mongodb://mongodb:27017/things
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=80 -XX:InitialRAMPercentage=40
      - CLUSTER_BS_REQUIRED_CONTACTS=1
    networks:
      water-network:
        aliases:
          - ditto-cluster
    depends_on:
      - ditto-policies
    restart: unless-stopped

  # ---- Ditto Things Search Service ----
  ditto-things-search:
    image: eclipse/ditto-things-search:3.4.3
    container_name: ditto-things-search
    environment:
      - TZ=UTC
      - INSTANCE_INDEX=1
      - BIND_HOSTNAME=0.0.0.0
      - MONGO_DB_URI=mongodb://mongodb:27017/searchDB
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=80 -XX:InitialRAMPercentage=40
      - CLUSTER_BS_REQUIRED_CONTACTS=1
    networks:
      water-network:
        aliases:
          - ditto-cluster
    depends_on:
      - ditto-policies
      - ditto-things
    restart: unless-stopped

  # ---- Ditto Gateway Service ----
  ditto-gateway:
    image: eclipse/ditto-gateway:3.4.3
    container_name: ditto-gateway
    environment:
      - TZ=UTC
      - INSTANCE_INDEX=1
      - BIND_HOSTNAME=0.0.0.0
      - ENABLE_PRE_AUTHENTICATION=true
      - DEVOPS_SECURE_STATUS=false
      - DITTO_DEVOPS_PWD=${DITTO_DEVOPS_PWD}
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=80 -XX:InitialRAMPercentage=40
      - CLUSTER_BS_REQUIRED_CONTACTS=1
    networks:
      water-network:
        aliases:
          - ditto-cluster
    depends_on:
      - ditto-policies
      - ditto-things
    restart: unless-stopped

  # ---- Ditto Connectivity Service ----
  ditto-connectivity:
    image: eclipse/ditto-connectivity:3.4.3
    container_name: ditto-connectivity
    environment:
      - TZ=UTC
      - INSTANCE_INDEX=1
      - BIND_HOSTNAME=0.0.0.0
      - MONGO_DB_URI=mongodb://mongodb:27017/connectivity
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -Xss512k -XX:MaxRAMPercentage=80 -XX:InitialRAMPercentage=40
      - CLUSTER_BS_REQUIRED_CONTACTS=1
    networks:
      water-network:
        aliases:
          - ditto-cluster
    depends_on:
      - ditto-policies
      - ditto-things
    restart: unless-stopped

  # ---- Nginx Reverse Proxy for Ditto ----
  nginx:
    image: nginx:1.25-alpine
    container_name: ditto-nginx
    ports:
      - "${DITTO_NGINX_PORT:-8085}:80"
    volumes:
      - ./ditto/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - water-network
    depends_on:
      - ditto-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

# ---- Volumes ----
volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  influxdb-config:
  grafana-data:
  mongodb-data:

# ---- Networks ----
networks:
  water-network:
    driver: bridge
    name: water-network
