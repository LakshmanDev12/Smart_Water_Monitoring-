# ============================================
# Mosquitto MQTT Broker Configuration
# ============================================

# Default MQTT listener
listener 1883
protocol mqtt

# WebSocket listener (optional, useful for browser-based clients)
listener 9001
protocol websockets

# Allow anonymous connections (development only)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all
