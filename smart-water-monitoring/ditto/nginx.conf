# Eclipse Ditto - Nginx Reverse Proxy Configuration

upstream ditto-gateway {
    server ditto-gateway:8080;
}

server {
    listen 80;
    server_name localhost;

    # Increase buffer size for Ditto responses
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Health check endpoint
    location /health {
        proxy_pass http://ditto-gateway/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # Status endpoint
    location /status {
        proxy_pass http://ditto-gateway/status;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # Ditto API with pre-authentication
    location /api/ {
        proxy_pass http://ditto-gateway/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pre-authentication header - identifies all requests as 'nginx:ditto'
        proxy_set_header x-ditto-pre-authenticated nginx:ditto;

        # CORS headers for development
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # DevOps API (basic auth passthrough)
    location /devops/ {
        proxy_pass http://ditto-gateway/devops/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
